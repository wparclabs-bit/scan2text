name: CI

# Every push and every pull request passes the five gates from the operating
# manual plus the slice-document checker, so no change lands behind a gate that
# does not exist (D-53, D-46).
#
# The runner is windows-latest only, the platform the application ships (D-56).
# There is no secret and no provider key anywhere in this workflow. The cloud
# provider seam is satisfied by its fake implementation, so the suite stays
# hermetic and no test touches the network (D-23).
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24.20.0"

jobs:
  # Fastest gate first: a malformed slice document fails the run in seconds.
  documentation:
    name: Documentation check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate every slice document
        run: py -3.12 scripts/check_slice_docs.py --all

  frontend:
    name: Frontend checks
    runs-on: windows-latest
    needs: documentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm.cmd ci
      - name: Frontend tests
        working-directory: frontend
        run: npm.cmd run test
      - name: Frontend typecheck
        working-directory: frontend
        run: npm.cmd run typecheck
      - name: Frontend build
        working-directory: frontend
        run: npm.cmd run build
      # Tauri resolves `frontendDist` while expanding its codegen macro, so the
      # Rust check needs the built frontend and not only the sources.
      - name: Upload the built frontend for the Rust check
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  backend:
    name: Backend checks
    runs-on: windows-latest
    needs: documentation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # D-57: the backend suite imports the local-inference adapter but never
      # the runtime. The adapter imports llama_cpp lazily inside the worker
      # function, so pytest passes without it. Building llama-cpp-python on
      # Windows needs CMake and a source compile, which is slow and fragile,
      # so the runtime is excluded on purpose and only the test subset is
      # installed here.
      - name: Install the backend test dependency subset
        run: py -3.12 -m pip install pytest httpx pytest-asyncio fastapi uvicorn pydantic python-multipart pillow psutil requests pypdfium2
      - name: Backend tests
        env:
          PYTHONPATH: src
        run: py -3.12 -m pytest -q --tb=line

  rust:
    name: Rust check
    runs-on: windows-latest
    needs:
      - documentation
      - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download the built frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Cargo check
        working-directory: frontend/src-tauri
        run: cargo check --message-format=short

  # Tag-only. Builds the frozen artifact and attaches it to a draft release;
  # a human publishes, so a broken binary is never shipped automatically
  # (D-58). The version comes from the packaging manifest, never a constant
  # (D-41).
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs:
      - documentation
      - frontend
      - backend
      - rust
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the product version from the packaging manifest
        id: version
        shell: pwsh
        run: |
          $version = py -3.12 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
      # Unlike the backend gate job, the frozen build needs the whole runtime,
      # including the local-inference engine, because PyInstaller collects its
      # native libraries into the artifact.
      - name: Install the release build dependencies
        run: py -3.12 -m pip install . pyinstaller
      - name: Build the frozen backend
        shell: pwsh
        run: pwsh -NoProfile -File scripts/build-backend.ps1
      - name: Build the desktop shell
        working-directory: frontend
        run: |
          npm.cmd ci
          npm.cmd exec -- tauri build --no-bundle
      # Same layout as scripts/package-portable.ps1 (docs/BUILD-PIPELINE.md):
      # the shell, the frozen backend, version.json, and empty runtime folders.
      - name: Assemble the portable artifact
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $staging = "portable"
          if (Test-Path $staging) { Remove-Item -LiteralPath $staging -Recurse -Force }
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "frontend/src-tauri/target/release/Scan2Text.exe" -Destination $staging -Force
          New-Item -ItemType Directory -Path "$staging/backend" -Force | Out-Null
          Copy-Item "backend/*" -Destination "$staging/backend" -Recurse -Force
          Copy-Item "version.json" -Destination $staging -Force
          foreach ($dir in "logs", "output", "feedback") {
            New-Item -ItemType Directory -Path "$staging/$dir" -Force | Out-Null
          }
          Compress-Archive -Path "$staging/*" -DestinationPath "Scan2Text-v$version-Portable.zip" -Force
      - name: Attach to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --generate-notes --title "Scan2Text v${{ steps.version.outputs.version }}" "Scan2Text-v${{ steps.version.outputs.version }}-Portable.zip"
