[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan2text"
version = "0.1.0"
description = "Portable offline OCR tool — converts images & PDFs to Markdown locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Scan2Text Contributors" },
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "llama-cpp-python>=0.3.7,<0.4",
    "pypdfium2>=4.30",
    "pywebview>=5.2",
    "requests>=2.32",
    "click>=8.1",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-asyncio>=0.24",
    "pyinstaller>=6.10",
]

[tool.setuptools.packages.find]
where = ["src"]
